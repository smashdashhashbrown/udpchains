# Dante socksify.  resolveprotocol: fake has the proxy resolve names, rather
# than this host.  The IPv6 route is accepted, but Dante's client does not
# carry IPv6 UDP (its log: "unsupported af 10"), and an IPv6 proxy address is
# rejected outright, so the proxy is given by its IPv4 address.
resolveprotocol: fake
route {
	from: 0.0.0.0/0 to: 0.0.0.0/0 via: 10.77.0.20 port = 1080
	proxyprotocol: socks_v5
	method: none
}
route {
	from: ::/0 to: ::/0 via: 10.77.0.20 port = 1080
	proxyprotocol: socks_v5
	method: none
}
