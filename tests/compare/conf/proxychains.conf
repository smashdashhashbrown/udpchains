# Used by both proxychains-ng PR #570 and Proxando.  A strict chain of one
# SOCKS5 proxy, which PR #570's wiki names as the only mode carrying UDP.
# proxy_dns is on, so names are resolved by the proxy rather than this host.
strict_chain
quiet_mode
proxy_dns
remote_dns_subnet 224
tcp_read_time_out 15000
tcp_connect_time_out 8000
[ProxyList]
socks5 10.77.0.20 1080
